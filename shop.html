<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | Monique Collections</title>
<meta name="description" content="Monique Collections sells kitchen appliances and home appliances. Call or WhatsApp 0793961544.">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <a class="brand" href="index.html">Monique Collections</a>
  <nav><a href="index.html">Home</a><a href="shop.html" class=active>Shop</a><a href="contact.html">Contact</a><a class="call" href="tel:+254793961544">Call 0793 961 544</a></nav>
</header>
<main>
<section>
  <h1>Shop</h1>
  <div class="filters">
    <input id="search" type="search" placeholder="Search products, e.g. blender" aria-label="Search products">
    <div id="filterBtns" class="chips"></div>
  </div>
  <p id="count" aria-live="polite"></p>
  <div class="grid" id="products"></div>
</section>
<section>
  <details id="owner" class="owner" hidden>
    <summary>Owner product manager</summary>
    <div id="loginBox">
      <p>Sign in to add, sell or remove products.</p>
      <form id="loginForm" novalidate>
        <label for="oemail">Email</label><input id="oemail" type="email" autocomplete="username">
        <label for="opass">Password</label><input id="opass" type="password" autocomplete="current-password">
        <span class="err" id="loginErr"></span>
        <button class="btn" type="submit">Sign in</button>
      </form>
    </div>
    <div id="manager" hidden>
      <p><span id="who"></span> <button class="btn alt small" id="signOut" type="button">Sign out</button></p>
      <p id="mgrStatus" aria-live="polite" class="note"></p>
      <h3>Add a product</h3>
      <form id="addForm" novalidate>
        <label for="pname">Name</label><input id="pname" type="text">
        <label for="pcat">Category</label><select id="pcat"></select>
        <label for="pprice">Price (KES)</label><input id="pprice" type="number" min="0" inputmode="numeric">
        <label for="pdesc">Description</label><textarea id="pdesc" rows="3"></textarea>
        <label for="pphoto">Photo</label><input id="pphoto" type="file" accept="image/*">
        <label class="check"><input id="pfeat" type="checkbox"> Show on the home page</label>
        <span class="err" id="addErr"></span>
        <button class="btn" type="submit" id="addBtn">Add product</button>
      </form>
      <h3>Your products</h3>
      <button class="btn alt small" id="importBtn" type="button">Import starter products</button>
      <div id="mgrList" class="mgr-list"></div>
    </div>
  </details>
</section>
</main>
<footer>
  <div>
    <strong>Monique Collections</strong>
    <p>Kitchen and home appliances.</p>
  </div>
  <div>
    <p>Phone: <a href="tel:+254793961544">0793 961 544</a></p>
    <p><a href="https://wa.me/254793961544">Chat on WhatsApp</a></p>
  </div>
  <p class="copy">&copy; <span id="year"></span> Monique Collections</p>
</footer>

<script src="products.js"></script>
<script src="script.js"></script>
<script type="module" src="live.js"></script>
<script type="module" src="admin.js"></script>
</body>
</html>
